<!doctype html><meta charset=utf-8>
<body style="background:#0a1420;color:#9fc0e6;font:14px system-ui;padding:24px">
<div id=o style="display:flex;gap:28px;flex-wrap:wrap"></div>
<script>function navSvg(t){
  const c='#9fc0e6', S=22, M=S/2;
  const hex=r=>[0,1,2,3,4,5].map(k=>{const a=(k*60-90)*Math.PI/180;return (M+r*Math.cos(a)).toFixed(1)+','+(M+r*Math.sin(a)).toFixed(1)}).join(' ');
  // 六角形の辺の外側に付く3つの突起(TACAN/VORTAC)。⚠ 角度の基準は hex() と揃えること(-90)
  const lobes=r=>[0,2,4].map(k=>{
    const a=(k*60-90)*Math.PI/180, b=((k+1)*60-90)*Math.PI/180;
    const P=(ang,rr)=>[(M+rr*Math.cos(ang)).toFixed(1),(M+rr*Math.sin(ang)).toFixed(1)].join(',');
    // 辺の両端から外側へ2.2伸ばした台形(辺に対して対称)
    return `<polygon points="${P(a+0.12,r)} ${P(a+0.30,r+2.2)} ${P(b-0.30,r+2.2)} ${P(b-0.12,r)}" fill="${c}"/>`;
  }).join('');
  const H=`<polygon points="${hex(6.2)}" fill="none" stroke="${c}" stroke-width="1.3"/>`;
  const SQ=`<rect x="${M-7.6}" y="${M-7.6}" width="15.2" height="15.2" fill="none" stroke="${c}" stroke-width="1.2"/>`;
  const DOT=`<circle cx="${M}" cy="${M}" r="1.2" fill="${c}"/>`;
  let g;
  if(/VORTAC/.test(t)) g=H+lobes(6.2)+DOT;
  else if(/VOR\/DME/.test(t)) g=SQ+H+DOT;
  else if(/^VOR/.test(t)) g=H+DOT;
  else if(/TACAN/.test(t)) g=lobes(6.2)+`<polygon points="${hex(6.2)}" fill="none" stroke="${c}" stroke-width="0.7" stroke-dasharray="2 2"/>`+DOT;
  else if(/DME/.test(t)) g=SQ+DOT;
  else if(/NDB/.test(t)) g=[...Array(10)].map((_,k)=>{const a=k*36*Math.PI/180;
      return `<circle cx="${(M+6.4*Math.cos(a)).toFixed(1)}" cy="${(M+6.4*Math.sin(a)).toFixed(1)}" r="0.9" fill="${c}"/>`}).join('')+DOT;
  else if(/LOC|GP|ILS/.test(t)) g=`<polygon points="${M},${M-6} ${M+3.4},${M+6} ${M},${M+3.4} ${M-3.4},${M+6}" fill="none" stroke="${c}" stroke-width="1.2"/>`;
  else g=`<circle cx="${M}" cy="${M}" r="5" fill="none" stroke="${c}" stroke-width="1.3"/>`+DOT;
  return `<svg width="${S}" height="${S}" viewBox="0 0 ${S} ${S}">${g}</svg>`;
}

const T=['VOR','VOR/DME','VORTAC','TACAN','DME','NDB','ILS-LOC',''];
document.getElementById('o').innerHTML=T.map(t=>`<div style="text-align:center">
  <div style="transform:scale(3);transform-origin:center;height:70px;display:flex;align-items:center;justify-content:center">${navSvg(t)}</div>
  <div style="margin-top:6px">${t||'(不明)'}</div></div>`).join('');
</script></body>
