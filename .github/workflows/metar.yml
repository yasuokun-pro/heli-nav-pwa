name: Update METAR
# 飛行場METARを定期取得して metar.json を更新(同一オリジン配信・CORS回避)。
# aviationweather.gov はブラウザからCORSで叩けないため、サーバ側(Actions)で取得する。
on:
  schedule:
    - cron: '8,38 * * * *'   # 毎時08分・38分(METARは毎時更新)
    # ⚠ GitHub は毎時00〜10分に定期実行が混むと間引く。実測でも1日7〜8回しか動いていない
    #   (30分間隔の設定でも2〜3時間おき)。少しでも外すため00分近くを避けている。
    #   アプリは中継(Vercel /api/wx)から最新METARを直接取るので、metar.json は中継が使えない時の控え。
  workflow_dispatch:
  push:
    paths: ['tools/metar_stations.json', '.github/workflows/metar.yml']

permissions:
  contents: write

concurrency:
  group: metar
  cancel-in-progress: true

jobs:
  metar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch METAR
        run: |
          python3 - <<'PY'
          import json, urllib.request, datetime, time, sys
          STALE_H = 3   # 配信中の metar.json がこの時間より古くなったら「失敗」にしてメールを出す
          sta = json.load(open('tools/metar_stations.json'))
          ids = ','.join(s['icao'] for s in sta)
          # hours=3: 直近3時間分(最新+過去)を取得してトレンドを見られるようにする
          url = 'https://aviationweather.gov/api/data/metar?ids='+ids+'&format=json&hours=3'
          req = urllib.request.Request(url, headers={'User-Agent':'heli-nav-pwa'})
          # aviationweather.gov の一時的な504/タイムアウト/空応答対策: 最大3回リトライ(5s,10s待機)。
          # ⚠ 3回とも失敗しても、配信中の metar.json が STALE_H 時間以内なら run は成功扱いにする。
          #   取得元の短い障害(2026-09-20 の証明書切れなど)で毎回メールが飛ぶのを防ぐため。
          #   それより古くなった = 実際に困る状態になってから失敗させて通知する。
          d = None
          for attempt in range(1, 4):
              try:
                  d = json.load(urllib.request.urlopen(req, timeout=60))
                  if d:
                      break
                  raise ValueError('empty response')
              except Exception as e:
                  print(f'METAR取得 試行{attempt}/3 失敗: {e}')
                  if attempt == 3:
                      stale = True
                      try:
                          prev = json.load(open('metar.json'))
                          t = datetime.datetime.strptime(prev['updated'], '%Y-%m-%dT%H:%MZ').replace(tzinfo=datetime.timezone.utc)
                          age = (datetime.datetime.now(datetime.timezone.utc) - t).total_seconds() / 3600
                          print(f'配信中の metar.json は {age:.1f} 時間前 (しきい値 {STALE_H} 時間)')
                          stale = age > STALE_H
                      except Exception as e2:
                          print(f'metar.json を読めない: {e2}')
                      if stale:
                          raise
                      print(f'::warning::取得元の一時的な障害。{STALE_H} 時間以内のMETARが残っているのでrunは成功扱いにする')
                      sys.exit(0)
                  time.sleep(5 * attempt)
          byst = {}
          for x in d:
              byst.setdefault(x['icaoId'], []).append(x)
          out = {'updated': datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%MZ'), 'm': {}}
          for icao, xs in byst.items():
              xs.sort(key=lambda z: z.get('obsTime') or 0, reverse=True)   # 新しい順
              x = xs[0]
              out['m'][icao] = {
                'raw': x.get('rawOb',''), 'cat': x.get('fltCat',''),
                'temp': x.get('temp'), 'wdir': x.get('wdir'), 'wspd': x.get('wspd'),
                'visib': x.get('visib'), 'obs': x.get('obsTime'),
                'hist': [{'obs': z.get('obsTime'), 'raw': z.get('rawOb',''),
                          'cat': z.get('fltCat','')} for z in xs[1:8]]}
          json.dump(out, open('metar.json','w'), ensure_ascii=False, separators=(',',':'))
          print(len(out['m']), 'stations')
          PY
      - name: Commit if changed
        run: |
          git config user.name  'metar-bot'
          git config user.email 'actions@github.com'
          git add metar.json
          git diff --cached --quiet || git commit -m 'METAR更新 [skip ci]'
          git push
